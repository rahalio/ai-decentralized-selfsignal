openapi: 3.1.0
info:
  title: Campaigns API
  version: 0.1.0
  description: |
    Campaign compliance gate before launch (BR-7, BR-10).
  x-domain: cmp
servers:
  - url: https://api.selfsignal.local
    description: Local / Selfsignal API
security:
  - apiKey: []
  - bearerJwt: []

tags:
  - name: Campaigns
    description: Brand campaign compliance
paths:
  /v1/campaigns:
    get:
      operationId: listCampaigns
      tags: [Campaigns]
      summary: List campaigns
      parameters:
      - name: cursor
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      - name: status
        in: query
        schema:
          type: string
          enum: [draft, approved, blocked, live, ended]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ./campaigns.schemas.yaml#/components/schemas/CampaignListResponse
        '400':
          $ref: ./common/responses.yaml#/components/responses/BadRequest
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
    post:
      operationId: createCampaign
      tags: [Campaigns]
      summary: Create campaign draft
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./campaigns.schemas.yaml#/components/schemas/CampaignCreate
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: ./campaigns.schemas.yaml#/components/schemas/CampaignResponse
        '400':
          $ref: ./common/responses.yaml#/components/responses/BadRequest
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
  /v1/campaigns/{campaignId}:
    parameters:
      - name: campaignId
        in: path
        required: true
        schema:
          $ref: ./campaigns.schemas.yaml#/components/schemas/CampaignId
    get:
      operationId: getCampaign
      tags: [Campaigns]
      summary: Get campaign
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ./campaigns.schemas.yaml#/components/schemas/CampaignResponse
        '400':
          $ref: ./common/responses.yaml#/components/responses/BadRequest
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
  /v1/campaigns/{campaignId}/compliance-gate:
    parameters:
      - name: campaignId
        in: path
        required: true
        schema:
          $ref: ./campaigns.schemas.yaml#/components/schemas/CampaignId
    post:
      operationId: runCampaignComplianceGate
      tags: [Campaigns]
      summary: Run campaign compliance gate
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      responses:
        '200':
          description: Gate result
          content:
            application/json:
              schema:
                $ref: ./campaigns.schemas.yaml#/components/schemas/CampaignGateResultResponse
        '400':
          $ref: ./common/responses.yaml#/components/responses/BadRequest
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

components:
  securitySchemes:
    apiKey:
      $ref: ./common/security.yaml#/components/securitySchemes/apiKey
    bearerJwt:
      $ref: ./common/security.yaml#/components/securitySchemes/bearerJwt
