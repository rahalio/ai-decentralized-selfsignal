openapi: 3.1.0
info:
  title: Rights Requests API
  version: 0.1.0
  description: |
    GDPR rights desk with SLA clocks (BR-4).
  x-domain: rrq
servers:
  - url: https://api.selfsignal.local
    description: Local / Selfsignal API
security:
  - apiKey: []
  - bearerJwt: []

tags:
  - name: RightsRequests
    description: GDPR consumer rights desk
paths:
  /v1/rights-requests:
    get:
      operationId: listRightsRequests
      tags: [RightsRequests]
      summary: List rights requests
      parameters:
      - name: cursor
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      - name: status
        in: query
        schema:
          type: string
          enum: [open, inProgress, fulfilled, rejected]
      - name: personId
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ./rights-requests.schemas.yaml#/components/schemas/RightsRequestListResponse
        '400':
          $ref: ./common/responses.yaml#/components/responses/BadRequest
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
    post:
      operationId: createRightsRequest
      tags: [RightsRequests]
      summary: Create rights request
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./rights-requests.schemas.yaml#/components/schemas/RightsRequestCreate
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: ./rights-requests.schemas.yaml#/components/schemas/RightsRequestResponse
        '400':
          $ref: ./common/responses.yaml#/components/responses/BadRequest
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
  /v1/rights-requests/{requestId}:
    parameters:
      - name: requestId
        in: path
        required: true
        schema:
          $ref: ./rights-requests.schemas.yaml#/components/schemas/RightsRequestId
    get:
      operationId: getRightsRequest
      tags: [RightsRequests]
      summary: Get rights request
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ./rights-requests.schemas.yaml#/components/schemas/RightsRequestResponse
        '400':
          $ref: ./common/responses.yaml#/components/responses/BadRequest
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
  /v1/rights-requests/{requestId}/fulfil:
    parameters:
      - name: requestId
        in: path
        required: true
        schema:
          $ref: ./rights-requests.schemas.yaml#/components/schemas/RightsRequestId
    post:
      operationId: fulfilRightsRequest
      tags: [RightsRequests]
      summary: Mark rights request fulfilled with evidence
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: ./rights-requests.schemas.yaml#/components/schemas/RightsRequestFulfil
      responses:
        '200':
          description: Fulfilled
          content:
            application/json:
              schema:
                $ref: ./rights-requests.schemas.yaml#/components/schemas/RightsRequestResponse
        '400':
          $ref: ./common/responses.yaml#/components/responses/BadRequest
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

components:
  securitySchemes:
    apiKey:
      $ref: ./common/security.yaml#/components/securitySchemes/apiKey
    bearerJwt:
      $ref: ./common/security.yaml#/components/securitySchemes/bearerJwt
