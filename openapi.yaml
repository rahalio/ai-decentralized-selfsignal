components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    PersonId:
      name: personId
      in: path
      required: true
      schema:
        type: string
    GrantId:
      name: grantId
      in: path
      required: true
      schema:
        type: string
    ActivationId:
      name: activationId
      in: path
      required: true
      schema:
        type: string
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
    IntegrationId:
      name: integrationId
      in: path
      required: true
      schema:
        type: string
    ComplaintId:
      name: complaintId
      in: path
      required: true
      schema:
        type: string
  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadRequest:
      description: Bad request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    ResponseMeta:
      type: object
      required:
      - requestId
      - timestamp
      properties:
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
    Problem:
      type: object
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
    VaultProfile:
      type: object
      required:
      - id
      - status
      properties:
        id:
          type: string
        displayHandle:
          type: string
        status:
          type: string
          enum:
          - active
          - erasurePending
          - erased
        locale:
          type: string
    VaultProfileCreate:
      type: object
      required:
      - locale
      properties:
        displayHandle:
          type: string
        status:
          type: string
          enum:
          - active
          - erasurePending
          - erased
        locale:
          type: string
    DataEnvelopeVaultProfile:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/VaultProfile'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ListEnvelopeVaultProfile:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: object
          required:
          - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/VaultProfile'
            nextCursor:
              type: string
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ConsentGrant:
      type: object
      required:
      - id
      - personId
      - purposeId
      - controllerIntegrationId
      - status
      - expiresAt
      properties:
        id:
          type: string
        personId:
          type: string
        purposeId:
          type: string
        controllerIntegrationId:
          type: string
        status:
          type: string
          enum:
          - active
          - withdrawn
          - expired
        expiresAt:
          type: string
          format: date-time
        signalClasses:
          type: array
          items:
            type: string
    ConsentGrantCreate:
      type: object
      required:
      - personId
      - purposeId
      - controllerIntegrationId
      - expiresAt
      - signalClasses
      properties:
        personId:
